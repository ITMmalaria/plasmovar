lint:
  files_exist:
    - CODE_OF_CONDUCT.md
    - assets/nf-core-plasmovar_logo_light.png
    - docs/images/nf-core-plasmovar_logo_light.png
    - docs/images/nf-core-plasmovar_logo_dark.png
    - .github/ISSUE_TEMPLATE/config.yml
    - .github/workflows/awstest.yml
    - .github/workflows/awsfulltest.yml
    - conf/igenomes.config
  files_unchanged:
    - CODE_OF_CONDUCT.md
    - assets/nf-core-plasmovar_logo_light.png
    - docs/images/nf-core-plasmovar_logo_light.png
    - docs/images/nf-core-plasmovar_logo_dark.png
    - .github/ISSUE_TEMPLATE/bug_report.yml
  multiqc_config:
    - report_comment
  nextflow_config:
    - manifest.name
    - manifest.homePage
nf_core_version: 3.1.0
repository_type: pipeline
template:
  author: Pieter Moris
  description: " Short variant caller for whole-genome sequences of Plasmodium parasites"
  force: false
  is_nfcore: false
  name: plasmovar
  org: pmoris
  outdir: .
  skip_features:
    - igenomes
  version: 1.0dev
